spring.application.name=crypto-scheduler
spring.h2.console.enabled=true

spring.datasource.url=jdbc:h2:~/test;MODE=MariaDB;
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

crypto.external.host=api.binance.com
crypto.external.scheme=https
crypto.external.path=/api/v3/ticker/bookTicker
crypto.external.sybolsParam=["ETHUSDT","BTCUSDT"]

spring.datasource.hikari.pool-name=masterHikariCP
spring.datasource.hikari.minimum-idle=8
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=10000

mybatis.mapper-locations=classpath:mappers/*.xml
spring.sql.init.mode=always
